---
- name: Provision DigitalOcean Droplet for Docker Applications
  hosts: all
  become: yes
  
  vars:
    deploy_user: deployer
    docker_compose_version: "2.23.0"
  
  tasks:
    # Update system
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
    
    - name: Upgrade all packages
      apt:
        upgrade: dist
        autoremove: yes
    
    # Install basic packages
    - name: Install required system packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - software-properties-common
          - ufw
          - fail2ban
          - python3-pip
          - git
        state: present
    
    # Configure firewall
    - name: Configure UFW defaults
      ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: 'incoming', policy: 'deny' }
        - { direction: 'outgoing', policy: 'allow' }
    
    - name: Allow SSH
      ufw:
        rule: allow
        port: '22'
        proto: tcp
    
    - name: Allow HTTP
      ufw:
        rule: allow
        port: '80'
        proto: tcp
    
    - name: Allow HTTPS
      ufw:
        rule: allow
        port: '443'
        proto: tcp
    
    - name: Enable UFW
      ufw:
        state: enabled
    
    # Install Docker - Modern method for Ubuntu 22.04+
    - name: Create directory for Docker GPG key
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
    
    - name: Add Docker GPG key
      shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg
    
    - name: Add Docker repository
      shell: |
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
      args:
        creates: /etc/apt/sources.list.d/docker.list
    
    - name: Update apt cache after adding Docker repo
      apt:
        update_cache: yes
    
    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
    
    - name: Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: yes
    
    # Install Docker Compose standalone (optional, docker-compose-plugin is included above)
    - name: Install Docker Compose
      get_url:
        url: "https://github.com/docker/compose/releases/download/v{{ docker_compose_version }}/docker-compose-linux-x86_64"
        dest: /usr/local/bin/docker-compose
        mode: '0755'
    
    # Create deploy user
    - name: Create deploy user
      user:
        name: "{{ deploy_user }}"
        shell: /bin/bash
        groups: docker
        append: yes
        create_home: yes
    
    - name: Add deploy user to sudoers
      lineinfile:
        path: /etc/sudoers.d/{{ deploy_user }}
        line: "{{ deploy_user }} ALL=(ALL) NOPASSWD: ALL"
        create: yes
        validate: 'visudo -cf %s'
    
    # Create application directories
    - name: Create application directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: '0755'
      loop:
        - /opt/apps
        - /opt/apps/frontend-dev
        - /opt/apps/frontend-prod
        - /opt/apps/backend-dev
        - /opt/apps/backend-prod
        - /opt/apps/mysql-dev
        - /opt/apps/mysql-prod
        - /opt/apps/caddy
    
    # Install Caddy - Modern method
    - name: Create directory for Caddy GPG key
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
    
    - name: Add Caddy GPG key
      shell: |
        curl -fsSL https://dl.cloudsmith.io/public/caddy/stable/gpg.key | gpg --dearmor -o /etc/apt/keyrings/caddy.gpg
        chmod a+r /etc/apt/keyrings/caddy.gpg
      args:
        creates: /etc/apt/keyrings/caddy.gpg
    
    - name: Add Caddy repository
      shell: |
        echo "deb [signed-by=/etc/apt/keyrings/caddy.gpg] https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main" | tee /etc/apt/sources.list.d/caddy.list > /dev/null
      args:
        creates: /etc/apt/sources.list.d/caddy.list
    
    - name: Update apt cache after adding Caddy repo
      apt:
        update_cache: yes
    
    - name: Install Caddy
      apt:
        name: caddy
        state: present
    
    - name: Create Caddyfile
      copy:
        dest: /etc/caddy/Caddyfile
        content: |
          # Development Frontend
          {{ frontend_dev_domain }} {
              reverse_proxy localhost:3000
              encode gzip
              
              header {
                  Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
                  X-Content-Type-Options "nosniff"
                  X-Frame-Options "SAMEORIGIN"
                  X-XSS-Protection "1; mode=block"
              }
          }
          
          # Production Frontend
          {{ frontend_prod_domain }} {
              reverse_proxy localhost:3001
              encode gzip
              
              header {
                  Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
                  X-Content-Type-Options "nosniff"
                  X-Frame-Options "SAMEORIGIN"
                  X-XSS-Protection "1; mode=block"
              }
          }
          
          # Development Backend API
          {{ backend_dev_domain }} {
              reverse_proxy localhost:5000
              encode gzip
              
              header {
                  Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
                  X-Content-Type-Options "nosniff"
              }
          }
          
          # Production Backend API
          {{ backend_prod_domain }} {
              reverse_proxy localhost:5001
              encode gzip
              
              header {
                  Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
                  X-Content-Type-Options "nosniff"
              }
          }
        owner: root
        group: root
        mode: '0644'
    
    - name: Restart Caddy
      systemd:
        name: caddy
        state: restarted
        enabled: yes
    
    # Configure fail2ban
    - name: Start and enable fail2ban
      systemd:
        name: fail2ban
        state: started
        enabled: yes
    
    # Setup Docker networks
    - name: Create Docker networks
      community.docker.docker_network:
        name: "{{ item }}"
        state: present
      loop:
        - app-network-dev
        - app-network-prod
    
    - name: Display success message
      debug:
        msg: "Server provisioning complete! Your server is ready for deployments."