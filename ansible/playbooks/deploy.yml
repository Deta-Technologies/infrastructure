---
- name: Deploy Applications
  hosts: all
  become: yes
  become_user: root
  
  vars:
    app_directory: /opt/apps
    deploy_user: deployer
  
  tasks:
    - name: Log in to GitHub Container Registry
      shell: |
        echo "{{ github_token }}" | docker login {{ docker_registry }} -u {{ github_username }} --password-stdin
      no_log: true
    
    - name: Copy docker-compose configuration
      template:
        src: templates/docker-compose.yml.j2
        dest: "{{ app_directory }}/docker-compose.yml"
        owner: root
        group: root
        mode: '0644'
    
    - name: Pull latest images
      shell: docker compose -f {{ app_directory }}/docker-compose.yml pull
      args:
        chdir: "{{ app_directory }}"
    
    - name: Deploy services
      shell: docker compose -f {{ app_directory }}/docker-compose.yml up -d --remove-orphans
      args:
        chdir: "{{ app_directory }}"
    
    - name: Prune old Docker images
      shell: docker image prune -f
    
    - name: Display deployment status
      debug:
        msg: "Deployment completed successfully!"