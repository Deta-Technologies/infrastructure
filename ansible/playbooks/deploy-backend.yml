---
- name: Deploy Backend
  hosts: all
  become: yes
  
  tasks:
    - name: Determine environment from tag
      set_fact:
        is_production: "{{ 'latest' in docker_image_tag }}"
        container_name: "{{ 'backend-prod' if 'latest' in docker_image_tag else 'backend-dev' }}"
        mysql_container: "{{ 'mysql-prod' if 'latest' in docker_image_tag else 'mysql-dev' }}"
        container_port: "{{ '5001' if 'latest' in docker_image_tag else '5000' }}"
        network_name: "{{ 'app-network-prod' if 'latest' in docker_image_tag else 'app-network-dev' }}"
        mysql_root_pass: "{{ mysql_root_password_prod if 'latest' in docker_image_tag else mysql_root_password_dev }}"
        mysql_db: "{{ mysql_database_prod if 'latest' in docker_image_tag else mysql_database_dev }}"
        mysql_user: "{{ mysql_user_prod if 'latest' in docker_image_tag else mysql_user_dev }}"
        mysql_pass: "{{ mysql_password_prod if 'latest' in docker_image_tag else mysql_password_dev }}"
    
    - name: Log in to GitHub Container Registry
      shell: |
        echo "{{ github_token }}" | docker login {{ docker_registry }} -u {{ github_username }} --password-stdin
      no_log: true
    
    - name: Ensure MySQL container is running
      community.docker.docker_container:
        name: "{{ mysql_container }}"
        image: mysql:8.0
        state: started
        restart_policy: unless-stopped
        networks:
          - name: "{{ network_name }}"
        ports:
          - "127.0.0.1:{{ '3307' if is_production else '3306' }}:3306"
        env:
          MYSQL_ROOT_PASSWORD: "{{ mysql_root_pass }}"
          MYSQL_DATABASE: "{{ mysql_db }}"
        volumes:
          - "/opt/apps/mysql-{{ 'prod' if is_production else 'dev' }}:/var/lib/mysql"
        command: --default-authentication-plugin=mysql_native_password
    
    - name: Wait for MySQL to be ready
      wait_for:
        host: 127.0.0.1
        port: "{{ '3307' if is_production else '3306' }}"
        delay: 5
        timeout: 60
    
    - name: Pull latest backend image
      community.docker.docker_image:
        name: "{{ docker_registry }}/{{ github_username }}/{{ backend_image_name }}"
        tag: "{{ docker_image_tag }}"
        source: pull
        force_source: yes
    
    - name: Stop and remove old backend container
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: absent
      ignore_errors: yes
    
    - name: Run new backend container
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ docker_registry }}/{{ github_username }}/{{ backend_image_name }}:{{ docker_image_tag }}"
        state: started
        restart_policy: unless-stopped
        networks:
          - name: "{{ network_name }}"
        ports:
          - "127.0.0.1:{{ container_port }}:5000"
        env:
          ASPNETCORE_ENVIRONMENT: "{{ 'Production' if is_production else 'Development' }}"
          ASPNETCORE_URLS: "http://+:5000"
          ConnectionStrings__DefaultConnection: "Server={{ mysql_container }};Port=3306;Database={{ mysql_db }};Uid={{ mysql_user }};Pwd={{ mysql_pass }};"
    
    - name: Prune old Docker images
      community.docker.docker_prune:
        images: yes
        images_filters:
          dangling: true
    
    - name: Display deployment status
      debug:
        msg: "Backend deployed successfully to {{ container_name }}!"